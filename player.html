<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sendspin</title>
<style>
  :root { --bg: #111; --fg: #ddd; --muted: #888; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif;
               transition: background 600ms ease, color 600ms ease; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  #https-warning { background: #c33; color: #fff; padding: 10px 16px; font-size: 14px; }
  #https-warning a { color: #fff; font-weight: 600; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 16px; font-size: 13px; }
  #bar input[type=text] { width: 260px; padding: 6px 8px; background: #0006; color: inherit; border: 1px solid #fff3; border-radius: 6px; }
  button { padding: 6px 12px; background: #fff2; color: inherit; border: 1px solid #fff3; border-radius: 6px; cursor: pointer; }
  button:hover { background: #fff3; }
  #status { color: var(--muted); }
  #stage { display: grid; place-items: center; }
  #logo { width: min(60vmin, 520px); height: min(60vmin, 520px); }
  #info { text-align: center; padding: 16px; min-height: 84px; }
  #title { font-size: 20px; font-weight: 600; }
  #artist { color: var(--muted); margin-top: 2px; }
  #progress { width: min(60vmin, 520px); height: 3px; background: #fff2; margin: 12px auto 0; border-radius: 2px; overflow: hidden; }
  #progress > div { height: 100%; width: 0; background: var(--fg); opacity: 0.7; }
  #viz { font: 11px monospace; color: var(--muted); margin-top: 8px; white-space: pre; }
  #beatdbg { font: 11px monospace; color: var(--muted); margin-top: 10px; display: flex; gap: 10px; align-items: center; justify-content: center; white-space: pre; }
  #led { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); opacity: 0.15; }
  #info.nodebug #palette, #info.nodebug #beatdbg, #info.nodebug #lane, #info.nodebug #viz { display: none; }
  #lane { display: block; width: min(60vmin, 520px); height: 75px; margin: 8px auto 0; border-radius: 6px; background: #0004; }
  #palette { display: flex; gap: 10px; justify-content: center; align-items: flex-end; margin-top: 14px; min-height: 64px; font: 10px monospace; color: var(--muted); }
  #palette .sw { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #palette .sw i { display: block; width: 44px; height: 30px; border-radius: 6px; border: 1px solid #fff2; }
  #palette .sw.used i { outline: 2px solid var(--fg); outline-offset: 2px; }
  #palette img { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; margin-right: 10px; }
  label { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div id="https-warning" hidden>
  This page is loaded over HTTPS, so your browser will block the plain WebSocket connection to a
  Music Assistant on your network. Open the <a id="http-link" href="#">http:// version of this page</a> instead.
</div>
<div id="bar">
  <input id="url" type="text" placeholder="http://<music-assistant-ip>:8927">
  <button id="connect">Connect</button>
  <span id="status">disconnected</span>
  <span style="flex:1"></span>
  <button data-cmd="previous">⏮</button>
  <button data-cmd="play">▶</button>
  <button data-cmd="pause">⏸</button>
  <button data-cmd="next">⏭</button>
  <label>vol <input id="vol" type="range" min="0" max="100" value="60"></label>
  <label><input id="react" type="checkbox" checked> react</label>
  <label><input id="optPulse" type="checkbox"> pulse</label>
  <label><input id="optFlash" type="checkbox"> flash</label>
  <label><input id="optSpectrum" type="checkbox"> spectrum</label>
  <label>sat <input id="sat" type="range" min="1" max="2.5" value="1" step="0.1"></label>
  <label><input id="optDebug" type="checkbox" checked> debug</label>
  <label><input id="optLock" type="checkbox" checked> beat lock</label>
  <label title="guess the tempo from onsets when the server sends no beats"><input id="optOnsets" type="checkbox" checked> onset tempo</label>
  <label><input id="optMarks" type="checkbox" checked> markers</label>
  <label>divs <input id="beatDivs" type="text" value="2,1,2,1,1" size="12" title="dashes per beat for paths 0-4; fractions allowed, e.g. 0.5 = one dash spanning two beats"></label>
  <label title="shift the visual beat later (+) or earlier (-) to match what you hear">offset <input id="beatOffset" type="range" min="-400" max="400" value="0" step="10"> <span id="beatOffsetVal">0 ms</span></label>
  <button id="mode">joined view</button>
  <button id="guides">guides</button>
</div>
<div id="stage"><div id="logo"></div></div>
<div id="info">
  <div id="title">&nbsp;</div>
  <div id="artist">&nbsp;</div>
  <div id="progress"><div></div></div>
  <div id="palette"></div>
  <div id="beatdbg"><span id="led"></span><span id="beattext"></span></div>
  <canvas id="lane" width="1040" height="150"></canvas>
  <div id="viz"></div>
</div>

<script type="module">
import { mountLogo, mixHex, BRAND_RED } from './logo.js';
import { SendspinPlayer } from './vendor/sendspin/sendspin.js';

const $ = id => document.getElementById(id);
// ?lite=1 for low-power devices: no corner filter, 30 fps, no debug drawing. ?fps=N caps the frame rate.
const params = new URLSearchParams(location.search);
const LITE = params.get('lite') === '1';
const logo = mountLogo($('logo'), { speed: 30, maxFps: +params.get('fps') || (LITE ? 30 : 60), radius: LITE ? 0 : 0.8 });
window.logo = logo;

// ---------- server URL ----------
// Remember the last Music Assistant address. When served from localhost assume MA is on this
// machine; when hosted elsewhere leave it blank, the user's MA is on their own network.
const saved = localStorage.getItem('sendspin.url');
const local = ['localhost', '127.0.0.1'].includes(location.hostname);
$('url').value = saved || (local ? 'http://localhost:8927' : '');
// A page on https:// cannot open ws:// to a LAN address (mixed content). Point at the http:// copy.
if (location.protocol === 'https:') {
  $('https-warning').hidden = false;
  $('http-link').href = 'http://' + location.host + location.pathname + location.search;
}

// ---------- visualizer frame queue, released on the server clock ----------
// Frames carry a server-clock timestamp for when they should be shown. We hold them until the
// player's time filter says that moment has arrived locally, and drop anything already stale.
let player = null, queue = [], vizConfig = null;
const energy = { v: 0 };
const bins = { v: new Float32Array(8), peak: new Float32Array(8).fill(0.5), floor: new Float32Array(8).fill(0.2) };
let beatsSeen = 0, peaksSeen = 0, lastLoud = 0;

function onFrame(frame) {
  // arrival lead: how far ahead of its timestamp a beat reaches us (server clock)
  if (frame.type === 'beat' && player) blog('beat-arrive', { ts: frame.timestampUs, leadMs: Math.round((frame.timestampUs - player.getCurrentServerTimeUs()) / 1000) });
  queue.push(frame);
  // frames can be sent several seconds ahead (beats especially); if the queue ever grows too far,
  // drop the furthest-future frames, never the soonest
  if (queue.length > 3000) { queue.sort((a, b) => a.timestampUs - b.timestampUs); queue.length = 3000; }
}

// ---------- beat clock from the server's beat frames ----------
// Music Assistant's beats come from offline analysis with server timestamps. Keep the recent
// ones, take the median spacing as the period, and predict the next beat in local time for the
// logo's lock. The estimate is refreshed on every beat.
const beats = { ts: [], period: 0, nextLocal: 0, lastLocal: 0, bpm: 0, downbeats: 0, calls: 0, source: 'none' };
// Full-song diagnostic log: every beat frame, every tempo decision, stream events. window.dumpLog() prints it.
const LOG = []; window.beatLog = LOG;
function blog(kind, data) { const e = { t: +(performance.now() / 1000).toFixed(2), kind, ...data }; LOG.push(e); if (LOG.length > 20000) LOG.shift(); if (kind !== 'beat-arrive') console.log(`[${e.t}s] ${kind}`, JSON.stringify(data)); }
window.dumpLog = () => LOG.map(e => JSON.stringify(e)).join('\n');
// Fallback tempo from onsets when the server has no beat schedule: score candidate periods
// (60-180 BPM) by how tightly the recent onsets cluster in phase, weighted by onset strength.
const onsets = [];                                              // {ts (server µs), w}
function estimateFromOnsets() {
  const nowS = player.getCurrentServerTimeUs();
  while (onsets.length && onsets[0].ts < nowS - 10_000_000) onsets.shift();
  if (onsets.length < 6) return null;
  // recent onsets count more, so a clear beat coming in after a loose intro takes over quickly
  for (const o of onsets) o.wr = o.w * (0.4 + 0.6 * Math.max(0, 1 - (nowS - o.ts) / 10_000_000));
  let best = null;
  for (let P = 333_000; P <= 1_000_000; P += 4000) {
    let re = 0, im = 0, wsum = 0;
    for (const o of onsets) { const a = 2 * Math.PI * ((o.ts % P) / P); re += o.wr * Math.cos(a); im += o.wr * Math.sin(a); wsum += o.wr; }
    // prefer the 80-160 BPM octave: phase clustering alone is ambiguous between a tempo and its double
    const bpm = 60e6 / P, pref = bpm >= 80 && bpm <= 160 ? 1 : 0.8;
    const score = pref * Math.hypot(re, im) / wsum;
    if (!best || score > best.score) best = { P, score, phase: Math.atan2(im, re) };
  }
  if (!best || best.score < 0.5) return null;
  // refine around the best candidate
  for (let P = best.P - 4000; P <= best.P + 4000; P += 250) {
    let re = 0, im = 0, wsum = 0;
    for (const o of onsets) { const a = 2 * Math.PI * ((o.ts % P) / P); re += o.wr * Math.cos(a); im += o.wr * Math.sin(a); wsum += o.wr; }
    const score = Math.hypot(re, im) / wsum;
    if (score > best.score) best = { P, score, phase: Math.atan2(im, re) };
  }
  // a beat happens where the phase angle is `phase`: ts = k*P + phase/(2π)*P
  const phaseUs = ((best.phase / (2 * Math.PI)) * best.P + best.P) % best.P;
  let next = nowS - (nowS % best.P) + phaseUs; while (next <= nowS) next += best.P;
  return { P: best.P, next, score: best.score };
}
let lastOnsetEstimate = 0;
const onsetVotes = [];                                           // recent raw estimates, for consensus
function trackOnset(f) {
  onsets.push({ ts: f.timestampUs, w: 0.3 + f.strength / 255 });
  if (!$('optOnsets').checked) return;
  const now = performance.now();
  // Server beats always win: if the stream includes 'beat' the server has a schedule for this track
  // (it coasts through gaps on its own), and once a server tempo is established for the track, keep it.
  const serverHasBeats = (vizConfig?.types || []).includes('beat') || beats.source === 'server';
  if (serverHasBeats || now - lastOnsetEstimate < 1000) return;
  lastOnsetEstimate = now;
  const est = estimateFromOnsets();
  blog('onset-est', est ? { bpm: +(60e6 / est.P).toFixed(1), score: +est.score.toFixed(2), onsets: onsets.length } : { none: true, onsets: onsets.length });
  if (!est) return;
  // Consensus: adopt a tempo when two consecutive estimates agree within 3%. Once adopted, keep
  // it unless a different tempo wins repeatedly (octave flips count as different).
  onsetVotes.push(est.P); if (onsetVotes.length > 2) onsetVotes.shift();
  const agree = onsetVotes.length === 2 && Math.max(...onsetVotes) / Math.min(...onsetVotes) < 1.03;
  const current = beats.source === 'onsets' ? beats.period : 0;
  if (current && Math.abs(est.P / current - 1) < 0.06) {
    // same tempo: refine phase only
  } else if (!agree) {
    return;                                                     // no stable consensus yet: keep what we have
  }
  const P = current && Math.abs(est.P / current - 1) < 0.06 ? current : est.P;
  beats.period = P; beats.bpm = 60e6 / P; beats.lastLocal = now; beats.source = 'onsets';
  beats.nextLocal = now + (est.next - player.getCurrentServerTimeUs()) / 1000;
  if ($('optLock').checked) logo.setBeatClock({ period: P / 1e6, nextBeatAt: beats.nextLocal });
}
window.beats = beats; window.debugQueue = () => ({ length: queue.length, types: queue.reduce((m, f) => (m[f.type] = (m[f.type] || 0) + 1, m), {}) });
function trackBeat(f) {
  beats.calls++;
  const prev = beats.ts[beats.ts.length - 1];
  blog('beat', { ts: f.timestampUs, gapMs: prev ? Math.round((f.timestampUs - prev) / 1000) : null, down: f.downbeat, leadMs: Math.round((f.timestampUs - player.getCurrentServerTimeUs()) / 1000) });
  beats.ts.push(f.timestampUs); if (beats.ts.length > 12) beats.ts.shift();
  (beats.all ||= []).push(f.timestampUs); if (beats.all.length > 600) beats.all.shift();   // whole-track window
  if (f.downbeat) beats.downbeats++;
  beats.lastLocal = performance.now();
  if (beats.ts.length < 3) return;
  // beat timestamps are quantised to the 20 ms audio chunk grid, so single gaps alternate around
  // the true period; average over the whole window instead of taking one gap
  const d = beats.ts.slice(1).map((t, i) => t - beats.ts[i]).sort((a, b) => a - b);
  const median = d[d.length >> 1];
  if (median < 250_000 || median > 1_500_000) return;
  // a gap in the schedule (missed beat): drop the window before the gap rather than fitting across it
  const gi = beats.ts.slice(1).findIndex((t, i) => Math.abs((t - beats.ts[i]) / median - 1) > 0.25);   // missed beat or re-anchored schedule
  if (gi >= 0) { blog('gap-drop', { droppedBefore: gi + 1, medianMs: Math.round(median / 1000) }); beats.ts = beats.ts.slice(gi + 1); if (beats.ts.length < 3) return; }
  // least-squares fit t_i = a + P*i over the window: period AND phase averaged over all beats,
  // so the grid reference does not jitter with each new quantised timestamp
  const n = beats.ts.length, mi = (n - 1) / 2, mt = beats.ts.reduce((a, b) => a + b, 0) / n;
  let cov = 0, vari = 0;
  beats.ts.forEach((t, i) => { cov += (i - mi) * (t - mt); vari += (i - mi) ** 2; });
  let P = cov / vari, a = mt - P * mi;                              // µs
  // Long-window period: once a track has delivered enough beats, fit the period over all of them.
  // A 12-beat window is ~0.3% accurate; a minute of beats is ~0.03%, which lets the grid coast for
  // the rest of the track if the server's beat feed stops, drifting well under a beat.
  // The long estimate is a trimmed mean of inter-beat gaps, not a line fit: a re-pushed schedule
  // (after a seek) shifts all later timestamps by an arbitrary offset, which would bias a fit but
  // only produces one odd gap, and odd gaps are excluded here.
  const all = beats.all || [];
  if (all.length >= 24) {
    const gaps = all.slice(1).map((t, i) => t - all[i]);
    const med = gaps.slice().sort((x, y) => x - y)[gaps.length >> 1];
    const good = gaps.filter(g => Math.abs(g / med - 1) < 0.15);
    const P2 = good.reduce((x, y) => x + y, 0) / good.length;
    if (good.length >= 20 && Math.abs(P2 / P - 1) < 0.03) { P = P2; a = mt - P * mi; }
    else if (Math.abs(P2 / P - 1) >= 0.03) beats.all = beats.ts.slice();   // tempo change: restart the long window
  }
  // Octave guard: a sudden 2x or 0.5x estimate is usually missed or doubled beats in the schedule,
  // not a tempo change. Keep the established period unless the new one persists for a while.
  if (beats.period) {
    const ratio = P / beats.period;
    const octave = Math.abs(ratio - 2) < 0.15 || Math.abs(ratio - 0.5) < 0.08;
    if (octave) {
      beats.octaveSince ||= performance.now();
      if (performance.now() - beats.octaveSince < 8000) { beats.guarded = (beats.guarded || 0) + 1; P = beats.period; a = mt - P * mi; }
    } else beats.octaveSince = 0;
  }
  beats.period = P; beats.bpm = 60e6 / P; beats.source = 'server';
  const nowS = player.getCurrentServerTimeUs();
  let next = a + P * (n - 1); while (next <= nowS) next += P;
  blog('tempo', { bpm: +(60e6 / P).toFixed(2), rawBpm: +(60e6 / (cov / vari)).toFixed(2), n, guarded: P !== cov / vari, nextInMs: Math.round((next - nowS) / 1000), gaps: beats.ts.slice(1).map((t, i) => Math.round((t - beats.ts[i]) / 1000)).join(',') });
  beats.nextLocal = performance.now() + (next - nowS) / 1000;
  if ($('optLock').checked) logo.setBeatClock({ period: P / 1e6, nextBeatAt: beats.nextLocal });
}
function release() {
  if (!player) return;
  const now = player.getCurrentServerTimeUs();
  queue.sort((a, b) => a.timestampUs - b.timestampUs);
  let i = 0;
  while (i < queue.length && queue[i].timestampUs <= now) {
    const f = queue[i++];
    if (now - f.timestampUs > 2_000_000) continue;   // stale: never render
    apply(f);
  }
  queue.splice(0, i);
}
function apply(f) {
  if (f.type === 'beat') trackBeat(f);
  if (f.type === 'peak') trackOnset(f);
  if (!$('react').checked) return;
  switch (f.type) {
    case 'loudness': {                      // 0..65535 is -60..0 dB(A), already perceptual
      const L = f.value / 65535; lastLoud = L;
      energy.v += (L - energy.v) * (L > energy.v ? 0.45 : 0.08);
      break;
    }
    case 'spectrum': {                      // one bin per segment, bass -> the biggest arcs
      if (!$('optSpectrum').checked) break;
      const n = Math.min(8, f.bins.length);
      for (let k = 0; k < n; k++) {
        const v = f.bins[k] / 65535;
        // per-band auto-gain: track a slow floor and peak, express the level between them
        bins.peak[k] = Math.max(v, bins.peak[k] - 0.001);
        bins.floor[k] = Math.min(v, bins.floor[k] + 0.0007);
        const span = Math.max(0.08, bins.peak[k] - bins.floor[k]);
        const lvl = Math.min(1, Math.max(0, (v - bins.floor[k]) / span));
        bins.v[k] += (lvl - bins.v[k]) * (lvl > bins.v[k] ? 0.6 : 0.2);
      }
      logo.setLevels(Array.from(bins.v));
      break;
    }
    case 'beat': if ($('optPulse').checked) logo.pulse(f.downbeat ? 1 : 0.55); beatsSeen++; break;
    case 'peak': if ($('optFlash').checked) logo.flash(f.strength / 255); peaksSeen++; break;
    case 'f_peak': break;
  }
}

// ---------- per-frame: map energy to flow speed, show a little telemetry ----------
let streaming = false;
function tick() {
  release();
  if (streaming && $('react').checked) {
    logo.setSpeed(8 + 120 * Math.pow(energy.v, 1.6));
  }
  const meta = lastState?.serverState?.metadata;
  if (meta?.progress && player) {
    const nowUs = player.getCurrentServerTimeUs();
    const p = meta.progress, ms = p.track_progress + (nowUs - (meta.timestamp ?? nowUs)) / 1000 * p.playback_speed / 1000;
    const frac = p.track_duration ? Math.min(1, Math.max(0, ms / p.track_duration)) : 0;
    $('progress').firstElementChild.style.width = (frac * 100) + '%';
  }
  // beat debug: LED brightens into each predicted beat; text shows tempo and per-path lock state
  const now = performance.now();
  const debug = $('optDebug').checked;
  $('info').classList.toggle('nodebug', !debug);
  // Flywheel: once a tempo is known the grid keeps running from its anchor, so the lock survives
  // gaps in the beat feed for up to FLYWHEEL_MS before it is released.
  // With a whole-track period estimate (24+ beats) the grid coasts for the rest of the track; with
  // only a short estimate it coasts 30 s. Track changes, seeks and stream ends reset it anyway.
  const FLYWHEEL_MS = (beats.all?.length || 0) >= 24 ? Infinity : 30000, sinceBeat = now - beats.lastLocal;
  const beatAlive = beats.period && sinceBeat < FLYWHEEL_MS && streaming;
  if (!beatAlive && logo.state.beat.on) logo.clearBeatClock();
  if (!debug) { requestAnimationFrame(tick); return; }          // release mode: no per-frame debug work
  if (beatAlive) {
    const Pms = beats.period / 1000;
    let tau = ((beats.nextLocal - now) % Pms + Pms) % Pms;
    $('led').style.opacity = 0.15 + 0.85 * Math.pow(1 - tau / Pms, 5);
    const dbg = logo.beatDebug().map(p => `p${p.path}/${p.div} n=${p.n} v=${p.v} err=${(p.errMs >= 0 ? '+' : '') + p.errMs}ms`).join('  ');
    const src = beats.source === 'onsets' ? 'onsets' : 'server';
    const coast = sinceBeat > 3000 ? `  coasting ${Math.round(sinceBeat / 1000)}s` : '';
    $('beattext').textContent = `${beats.bpm.toFixed(1)} bpm (${src})  downbeats ${beats.downbeats}  lock ${logo.state.beat.on ? 'on' : 'off'}${coast}   ${dbg}`;
  } else {
    $('led').style.opacity = 0.15;
    // the server adds 'beat' to the stream types only once it has a beat schedule for the track
    const types = vizConfig?.types || [];
    $('beattext').textContent = !streaming ? '' : types.includes('beat')
      ? `server offers beats (${beats.calls} so far)${beats.calls ? ', waiting for a steady tempo' : ', none received yet'}`
      : `server offers: ${types.join(', ') || 'nothing'}  (no beat schedule for this track)`;
  }
  drawLane(now, beatAlive);
  $('viz').textContent = streaming
    ? `loud ${lastLoud.toFixed(2)}  energy ${energy.v.toFixed(2)}  beats ${beatsSeen}  peaks ${peaksSeen}  bins ${Array.from(bins.v, x => x.toFixed(1)).join(' ')}`
    : (vizConfig === null ? '' : 'visualizer stream idle');
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- beat lane: time scrolls left; beat ticks are lines, dash entries are dots per path ----------
// When the lock holds, every dot sits on a line. Hollow dots are the predicted next entries.
const lane = $('lane'), lctx = lane.getContext('2d');
const LANE_PAST = 2400, LANE_FUTURE = 800;                   // ms shown left/right of "now"
function drawLane(now, beatAlive) {
  const W = lane.width, H = lane.height, x0 = W * LANE_PAST / (LANE_PAST + LANE_FUTURE);
  const tx = t => x0 + (t - now) * W / (LANE_PAST + LANE_FUTURE);
  lctx.clearRect(0, 0, W, H);
  lctx.fillStyle = '#ffffff10'; lctx.fillRect(x0, 0, W - x0, H);       // future
  lctx.strokeStyle = '#ffffff90'; lctx.lineWidth = 2; lctx.beginPath(); lctx.moveTo(x0, 0); lctx.lineTo(x0, H); lctx.stroke();
  if (!beatAlive) return;
  const Pms = beats.period / 1000;
  lctx.lineWidth = 1;
  for (let t = beats.nextLocal; t > now - LANE_PAST; t -= Pms) if (t <= now + LANE_FUTURE) {
    lctx.strokeStyle = '#ffffff55'; lctx.beginPath(); lctx.moveTo(tx(t), 0); lctx.lineTo(tx(t), H); lctx.stroke();
  }
  for (let t = beats.nextLocal + Pms; t <= now + LANE_FUTURE; t += Pms) {
    lctx.strokeStyle = '#ffffff55'; lctx.beginPath(); lctx.moveTo(tx(t), 0); lctx.lineTo(tx(t), H); lctx.stroke();
  }
  const paths = logo.beatDebug(), rowH = H / (paths.length + 1);
  const cols = logo.state.dashColors;
  paths.forEach((p, i) => {
    const y = rowH * (i + 1), col = cols[i % cols.length];
    lctx.fillStyle = '#ffffff70'; lctx.font = '16px monospace'; lctx.fillText(`p${p.path} n${p.n}`, 6, y + 6);
    for (const t of p.entries) if (t > now - LANE_PAST) { lctx.fillStyle = col; lctx.beginPath(); lctx.arc(tx(t), y, 6, 0, 7); lctx.fill(); }
    if (p.nextInMs !== null) { lctx.strokeStyle = col; lctx.lineWidth = 2; lctx.beginPath(); lctx.arc(tx(now + p.nextInMs), y, 6, 0, 7); lctx.stroke(); }
  });
}

// ---------- state from the server: playback, metadata, colours ----------
const rgb = c => Array.isArray(c) ? '#' + c.map(v => v.toString(16).padStart(2, '0')).join('') : null;
const lum = hex => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const n = parseInt(hex.slice(1), 16); return 0.2126 * f(n >> 16 & 255) + 0.7152 * f(n >> 8 & 255) + 0.0722 * f(n & 255); };
const contrast = (a, b) => { const la = lum(a) + 0.05, lb = lum(b) + 0.05; return la > lb ? la / lb : lb / la; };
let lastColorTs = null, lastState = null, lastPalette = null;

// The colour role is the whole palette Sendspin has: six colours derived from the artwork.
const PALETTE_KEYS = ['background_dark', 'background_light', 'primary', 'accent', 'on_dark', 'on_light'];
function saturate(hex, k) {              // scale HSL saturation by k, keep lightness
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return hex;
  const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6;
  const s2 = Math.min(1, s * k), q = l < 0.5 ? l * (1 + s2) : l + s2 - l * s2, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return '#' + [f(h + 1 / 3), f(h), f(h - 1 / 3)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}
function applyPalette(c) {
  // Follow the spec's own pairing: background_dark is the surface, on_dark is the colour the
  // server guarantees readable on it (>= 4.5:1). primary/accent/background_light carry the
  // artwork's character but are not contrast-adjusted, so each is blended into on_dark only as
  // far as it can go while the result still clears MIN_CONTRAST against the background.
  const MIN_CONTRAST = 3.5;
  const bg = rgb(c.background_dark) || '#111', onDark = rgb(c.on_dark) || '#f0f0f0';
  const k = +$('sat').value;
  const safest = col => {                 // largest blend of col into onDark that stays readable
    let lo = 0, hi = 1;
    if (contrast(col, bg) >= MIN_CONTRAST) return col;
    for (let i = 0; i < 12; i++) { const t = (lo + hi) / 2; (contrast(mixHex(onDark, col, t), bg) >= MIN_CONTRAST ? lo = t : hi = t); }
    return lo < 0.2 ? null : mixHex(onDark, col, lo);   // too little of the colour survives: skip it
  };
  const usable = [{ key: 'on_dark', col: onDark }];
  for (const key of ['primary', 'accent', 'background_light', 'on_light']) {
    const raw = rgb(c[key]); if (!raw) continue;
    const col = safest(raw);
    if (col && !usable.some(u => contrast(u.col, col) < 1.15)) usable.push({ key, col });
  }
  const list = usable.map(u => saturate(u.col, k));
  logo.setDashColors(list); logo.recolor();
  document.documentElement.style.setProperty('--bg', bg); logo.setBackground(bg);
  if (onDark) document.documentElement.style.setProperty('--fg', onDark);
  // debug strip: artwork plus all six palette colours, the ones in use outlined
  const art = lastState?.serverState?.metadata?.artwork_url;
  $('palette').innerHTML = (art ? `<img src="${art}" alt="">` : '') + PALETTE_KEYS.map(key => {
    const col = rgb(c[key]);
    const ratio = col ? contrast(col, bg).toFixed(1) : '';
    return `<div class="sw ${usable.some(u => u.key === key) ? 'used' : ''}"><i style="background:${col || 'transparent'}"></i>${key.replace('background', 'bg')}<br>${col || '–'}<br>${ratio}:1</div>`;
  }).join('') + `<div class="sw"><i style="background:linear-gradient(90deg,${list.join(',')})"></i>shapes<br>${list.length} colours</div>`;
  console.log('palette', JSON.stringify(c), '-> shapes', list);
}
$('sat').addEventListener('input', () => { if (lastPalette) applyPalette(lastPalette); });

function onState(state) {
  lastState = state; window.lastState = state;
  // group/update is optional; the player stream itself is the reliable playing signal
  const playing = state.isPlaying || state.groupState?.playback_state === 'playing';
  if (!playing) { logo.setAnimating(false); logo.clearLevels(); energy.v = 0; }
  else if (streaming) logo.setAnimating(true);

  const m = state.serverState?.metadata;
  if (m?.title && m.title !== window._lastTitle) {
    window._lastTitle = m.title; blog('track', { title: m.title, artist: m.artist });
    // new track: its tempo is unknown, drop the old grid rather than coasting into it
    beats.ts = []; beats.all = []; beats.period = 0; beats.source = 'none'; if (logo.state.beat.on) logo.clearBeatClock();
  }
  $('title').textContent = m?.title || (player ? 'Nothing playing' : ' ');
  $('artist').textContent = [m?.artist, m?.album].filter(Boolean).join(' · ') || ' ';

  const c = state.serverState?.color;
  if (c && c.timestamp !== lastColorTs) {
    lastColorTs = c.timestamp;
    lastPalette = c;
    const applyColor = () => applyPalette(c);
    // future timestamp = scheduled for the audible track change
    const wait = player ? (c.timestamp - player.getCurrentServerTimeUs()) / 1000 : 0;
    if (wait > 50 && wait < 30000) setTimeout(applyColor, wait); else applyColor();
  }
  $('status').textContent = `${state.isPlaying ? 'playing' : 'idle'}${state.groupState?.group_name ? ' · ' + state.groupState.group_name : ''}`;
}

// ---------- connect ----------
$('connect').addEventListener('click', async () => {
  if (player) { player.disconnect('user_request'); player = null; streaming = false; $('connect').textContent = 'Connect'; $('status').textContent = 'disconnected'; logo.setAnimating(false); return; }
  let baseUrl = $('url').value.trim();
  if (!baseUrl) { $('status').textContent = 'enter your Music Assistant address, e.g. http://192.168.1.10:8927'; return; }
  if (!/^https?:\/\//.test(baseUrl)) baseUrl = 'http://' + baseUrl;          // accept a bare IP or host
  if (!/:\d+/.test(baseUrl.replace(/^https?:\/\//, ''))) baseUrl += ':8927';  // default Sendspin port
  $('url').value = baseUrl;
  localStorage.setItem('sendspin.url', baseUrl);
  player = new SendspinPlayer({
    baseUrl,
    clientName: 'Sendspin Logo',
    productName: 'Sendspin logo visualizer',
    visualizer: {
      types: ['loudness', 'beat', 'peak', 'spectrum'],
      rate_max: 30,
      spectrum: { n_disp_bins: 8, scale: 'mel', f_min: 40, f_max: 16000 },
    },
    onVisualizerFrame: onFrame,
    onVisualizerStream: cfg => {
      vizConfig = cfg; window.vizConfig = cfg; streaming = cfg !== null; queue = [];
      blog('stream', { types: cfg?.types || null, tracksDownbeats: cfg?.tracks_downbeats ?? null });
      if (cfg === null) { beats.ts = []; beats.all = []; beats.period = 0; beats.source = 'none'; onsets.length = 0; }
      if (!streaming) { logo.setAnimating(false); logo.clearLevels(); }
      else logo.setAnimating(true);
      console.log('visualizer stream', cfg);
    },
    onVisualizerClear: () => { queue = []; blog('clear', {}); beats.ts = []; beats.all = []; onsets.length = 0; },
    onStateChange: onState,
    onPairingPin: (pin) => { $('status').textContent = `pairing PIN: ${pin}`; },
    reconnect: { onReconnecting: n => $('status').textContent = `reconnecting (${n})`, onReconnected: () => $('status').textContent = 'connected' },
  });
  window.player = player;
  try {
    await player.unlock();          // must be first awaited work in the click handler (audio unlock)
    $('status').textContent = 'connecting…';
    await player.connect();
    player.setVolume(+$('vol').value);
    $('connect').textContent = 'Disconnect';
    $('status').textContent = 'connected';
  } catch (e) {
    const blocked = location.protocol === 'https:' ? ' (HTTPS page cannot reach a ws:// server; use the http:// page)' : '';
    $('status').textContent = 'failed: ' + (e?.message || e) + blocked;
    console.error(e);
    player = null;
  }
});

// ---------- transport + view controls ----------
for (const b of document.querySelectorAll('[data-cmd]')) b.addEventListener('click', () => player?.sendCommand(b.dataset.cmd));
$('vol').addEventListener('input', () => player?.setVolume(+$('vol').value));
$('optSpectrum').addEventListener('change', () => { if (!$('optSpectrum').checked) logo.clearLevels(); });
$('optLock').addEventListener('change', () => { if (!$('optLock').checked) logo.clearBeatClock(); });
$('optMarks').addEventListener('change', () => logo.showBeatMarkers($('optMarks').checked));
$('optDebug').addEventListener('change', () => { if (!$('optDebug').checked) { $('optMarks').checked = false; logo.showBeatMarkers(false); } });
// dashes per beat, one value per path (0-4); paths 0 and 2 run on half-beats by default
const applyDivs = () => logo.setPathBeatDivs($('beatDivs').value.split(/[,\s]+/).map(v => +v || null));
$('beatDivs').addEventListener('change', applyDivs);
applyDivs();
if (LITE) { $('optDebug').checked = false; $('optMarks').checked = false; }
window.estimateFromOnsets = estimateFromOnsets; window.onsets = onsets;
// manual beat offset: persisted, since it mostly reflects the output device's latency
const applyOffset = () => { const ms = +$('beatOffset').value; logo.setBeatOffset(ms); $('beatOffsetVal').textContent = `${ms} ms`; localStorage.setItem('sendspin.beatOffset', ms); };
$('beatOffset').value = localStorage.getItem('sendspin.beatOffset') || 0;
$('beatOffset').addEventListener('input', applyOffset);
applyOffset();
logo.showBeatMarkers(true);
$('mode').addEventListener('click', () => { logo.toggleMode(); $('mode').textContent = logo.state.mode === 'joined' ? 'offset view' : 'joined view'; });
$('guides').addEventListener('click', () => logo.showGuides(!logo.svg.classList.contains('show-guides')));
</script>
</body>
